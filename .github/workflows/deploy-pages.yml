# Builds the app and publishes dist/ to GitHub Pages.
#
# Pages must be pointed at this workflow: repository Settings -> Pages ->
# "Build and deployment" -> Source: "GitHub Actions". Serving straight from a
# branch publishes the repository root, whose index.html is the Vite dev entry
# (it loads /src/main.tsx, which a browser cannot execute) and renders blank.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/bug-fixes-1k56pg
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
